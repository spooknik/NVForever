# The profiling campaign's scenarios (tools/profile/campaign.py; docs/design/frame-rate-audit.md §5).
# Each is one launch of a `profile` build with the span profile, the frame-time log and the
# stress samples, the enhanced look at 1920x1080, vsync off, in a home without stored settings,
# as the stress runs make it (god mode, unseen, script boxes closed: tools/stress lib.py).
#
# Fields: `group` (stand, interior, crowd, combat, move, stream), `args` (nvforever arguments
# besides the defaults), `aids` (test aids), `seconds` (run length), `battle` = { per_side,
# third } (the stress battle's layout at Goodsprings, tools/stress battle.py), `play = false`
# (the free camera, for the fly-through).

[defaults]
seconds = 60
# Seconds after the first frame-time line that are left out (loading, pipelines, spawning).
warmup = 15
every = 5
# Frames this long or longer are listed with their spans (NVF_PLAY_TEST_PROFILE_HITCH_MS): the
# occasional 20 ms frames of 7 ms scenes. Battles, slower throughout, set their own.
slow_ms = 16
size = "1920x1080"
graphics = "enhanced"

