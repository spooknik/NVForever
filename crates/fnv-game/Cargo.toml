[package]
name = "fnv-game"
description = "Layer 5 game rules: script instances, quests, conditions, event dispatch and script functions over the Layer 4 world"
version.workspace = true
edition.workspace = true
license.workspace = true
# The integration tests: one binary, tests/main.rs, plus the files that need a process of their own.
autotests = false

[dependencies]
fnv-esm = { path = "../fnv-esm" }
fnv-sim = { path = "../fnv-sim" }
fnv-world = { path = "../fnv-world" }
fnv-script = { path = "../fnv-script" }
fnv-util = { path = "../fnv-util" }
fnv-ui = { path = "../fnv-ui" }
fnv-vfs = { path = "../fnv-vfs" }
# guard_write: no write into the game install or its user folder (mod_files).
fnv-install = { path = "../fnv-install" }
serde.workspace = true
serde_json.workspace = true
thiserror.workspace = true
rand_core = "0.9"
rand_chacha = "0.9"
rayon = "1"
tracing = "0.1"
chrono = { version = "0.4", default-features = false, features = ["clock", "std"] }
# SUP's screenshots and QR codes (image_files.rs): PNG, the version the engine already
# builds; QR codes for TextToQRCode (docs/design/dependencies.md).
png = "0.18"
qrcodegen = "1.8"
# The runner's save_load op writes and reads the save container.
fnv-save = { path = "../fnv-save" }

[dev-dependencies]
tracing-subscriber = "0.3"

[[test]]
name = "integration"
path = "tests/main.rs"

# Change process-wide state (mod_files' roots, nvse_jg7's combat-music flag,
# source_compile's mode).
[[test]]
name = "anim_folders"
path = "tests/anim_folders.rs"

[[test]]
name = "build_shortcuts"
path = "tests/build_shortcuts.rs"

[[test]]
name = "jg7"
path = "tests/jg7.rs"

[[test]]
name = "jg9"
path = "tests/jg9.rs"

[[test]]
name = "nvse_itr1"
path = "tests/nvse_itr1.rs"

[[test]]
name = "script_runner"
path = "tests/script_runner.rs"

[[test]]
name = "small_libs"
path = "tests/small_libs.rs"

[[test]]
name = "sup3"
path = "tests/sup3.rs"

[[test]]
name = "sup5"
path = "tests/sup5.rs"

[[test]]
name = "synthetic"
path = "tests/synthetic.rs"

# CompileScript path fixtures replace the process-wide file reader.
[[test]]
name = "compile_script_paths"
path = "tests/compile_script_paths.rs"

[[test]]
name = "runtime_origin"
path = "tests/runtime_origin.rs"

[[test]]
name = "jip_cloned_list_wildcard"
path = "tests/jip_cloned_list_wildcard.rs"

[[test]]
name = "jip_required_animation_codes"
path = "tests/jip_required_animation_codes.rs"
