[package]
name = "fnv-phys"
description = "Physics for Fallout: New Vegas worlds: rapier3d bodies from collision shapes and terrain, queries and a kinematic character controller"
version.workspace = true
edition.workspace = true
license.workspace = true

# Pipeline timers are opt-in; default releases keep Rapier's timers compiled out.
[features]
profiler = ["rapier3d/profiler"]

[dependencies]
fnv-collide = { path = "../fnv-collide" }
fnv-esm = { path = "../fnv-esm" }
fnv-world = { path = "../fnv-world" }
# Pinned exactly: traces are compared bit for bit, and rapier may change results between
# patch releases.
rapier3d = { version = "=0.36.0", features = ["enhanced-determinism"] }
serde.workspace = true
serde_json.workspace = true
thiserror.workspace = true
# Spans round the parts of a fixed step (`PhysWorld::step`), seen as zones in the engine's
# Tracy build; the version the other crates use.
tracing = "0.1"

[dev-dependencies]
proptest = "1"
