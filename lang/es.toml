"NVForever fetches four files from NVIDIA's Streamline 2.14.16 release on GitHub: sl.interposer.dll, sl.common.dll and sl.dlss.dll, under Streamline's MIT licence, and nvngx_dlss.dll, under NVIDIA's licence below. Nothing is downloaded unless you accept it." = "NVForever descarga cuatro archivos de la versión 2.14.16 de Streamline de NVIDIA en GitHub: sl.interposer.dll, sl.common.dll y sl.dlss.dll, con la licencia MIT de Streamline, y nvngx_dlss.dll, con la licencia de NVIDIA de abajo. No se descarga nada si no la aceptas."
