# [design, #2249] Overlay availability and source scope (perf_overlay/readings.rs, settings.rs).
"Not available" = "No disponible"
"game {percent}%" = "juego {percent}%"
"Machine and game CPU use, read once a second while shown. Windows uses performance counters; Linux uses /proc. Missing machine readings say Not available. Game use is cores kept busy: 1.0 is one full core." = "Uso de CPU del equipo y del juego, leído cada segundo mientras se muestra. Windows usa contadores de rendimiento; Linux usa /proc. Las lecturas del equipo que faltan indican No disponible. El uso del juego cuenta núcleos ocupados: 1.0 es un núcleo completo."
"GPU use, read once a second while shown. Windows: busiest engine across programs. Linux: NVIDIA NVML, then amdgpu, then DRM client time. DRM reads game use and says game; the other Linux sources read whole-device use. Missing readings say Not available." = "Uso de GPU, leído cada segundo mientras se muestra. Windows: el motor más ocupado entre todos los programas. Linux: NVIDIA NVML, después amdgpu y después tiempo del cliente DRM. DRM mide el uso del juego y lo indica con juego; las otras fuentes de Linux miden todo el dispositivo. Las lecturas que faltan indican No disponible."

# [design, #2242] The upscaling row (perf_overlay/readings.rs, settings.rs).
"model {model}" = "modelo {model}"
"The upscaler that draws now: its name and mode, the size the world is drawn at and the size it is rebuilt to (with FSR 3.1 and Bilinear from its mode, with DLSS the size DLSS chose), and with DLSS the model asked for. Reads Off and the window's size while nothing upscales, also when the upscaler asked for cannot run on this computer. Follows a change within a frame or two, showing the upscaler without sizes until then." = "El escalador que dibuja ahora: su nombre y modo, el tamaño al que se dibuja el mundo y el tamaño al que se reconstruye (con FSR 3.1 y Bilineal según su modo, con DLSS el tamaño que eligió DLSS) y, con DLSS, el modelo pedido. Muestra Desactivado y el tamaño de la ventana mientras nada se escala, también cuando el escalador pedido no puede funcionar en este equipo. Sigue un cambio en uno o dos fotogramas y, hasta entonces, muestra el escalador sin tamaños."
